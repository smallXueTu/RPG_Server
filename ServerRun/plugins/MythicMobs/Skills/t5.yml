T5对话1:
  Skills:
    - message{m="&d<trigger.name>&r>> &6这前面好像有一个宝箱，看着还被封印的样子。不知道打开会不会有什么危险。。。"} @Self
    - delay 20
    - message{m="&d<trigger.name>&r>> &6看来这个地方还存在很多这样的箱子，还是多观察观察周围和角落吧。。。"} @Self
    - execBQEvent{e=添加已触发T5对话1标签}
    - execBQEvent{e=等待获得终极武器图纸}
第一次打开T5宝箱:
  Skills:
    - message{m="&c箱子的守卫者出来了，在120s内将他们一网打尽！即可拿走战利品！"} @Self
    - message{m="&d<trigger.name>&r>> &6哎呀，居然还有守卫者，这箱子肯定有什么好东西，先解决他们再说吧！"} @Self
T5对话2:
  Skills:
    - message{m="&d<trigger.name>&r>> &6好像捡到了一张锻造图纸，应该跟高级武器一样的流程，还是先继续收集一下材料吧！"} @Self
    - delay 20
    - message{m="&d<trigger.name>&r>> &6这周围好像有好多隐蔽的箱子，还是小心点不要错过吧！"} @Self
t5主线保护门1:
  Skills:
    - particleDoor{y=180;q=19;yi=0.8;i=0.3;r=10;yq=3;ox=-0.5}
末影守卫者粉碎攻击:
  Cooldown: 12
  Conditions:
    - IsSilence{}<&csp>false
    - targetwithin 25
  Skills:
    - teleport @target
    - effect:sound{s=mob.endermen.portal;volume=1.0;pitch=0.5}
    - delay 5
    - damage{amount=50;ignorearmor=true} @target
    - throw{velocity=10;velocityY=5} @target
    - effect:explosion @Self
末影守卫者惊讶:
  Cooldown: 60
  TargetConditions:
    - HandQuality {q=终极}
  Skills:
    - message{m="<mob.name>&d>><&co> &c你居然有统治末影之城的武器，算你有点东西！！！"} @Target
末影守卫者嘲讽:
  TargetConditions:
    - HandQuality {q=终极}<&csp>false
  Skills:
    - CancelEvent
    - message{m = <mob.name>&c你的攻击被末影之盾抵消了！} @Trigger
    - effect:particlesphere{amount=100;radius=1.2;particle=dragonbreath;} @SelfLocation{yoffset=1}
    - sound{s=entity.zombie.attack_iron_door;p=2} @self